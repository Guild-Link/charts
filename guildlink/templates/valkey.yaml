apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-valkey
  labels:
    {{- include "guildlink.labels" (dict "root" . "component" "valkey") | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-valkey
  replicas: 1
  selector:
    matchLabels:
      {{- include "guildlink.selectorLabels" (dict "root" . "component" "valkey") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "guildlink.labels" (dict "root" . "component" "valkey") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsGroup: 1000
        runAsUser: 999
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: {{ .Values.images.valkey }}
          {{- with (index .Values.extraEnv "valkey") }}
          env:
            {{- include "guildlink.extraEnv" (dict "root" $ "component" "valkey") | nindent 12 }}
          {{- end }}
          {{- include "guildlink.extraEnvFrom" (dict "root" . "component" "valkey") | nindent 10 }}
          args:
            - --protected-mode
            - "no"
            - --appendonly
            - "yes"
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: valkey
          livenessProbe:
            tcpSocket:
              port: valkey
          resources:
            {{- toYaml .Values.resources.valkey | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        labels:
          {{- include "guildlink.labels" (dict "root" . "component" "valkey") | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-valkey
  labels:
    {{- include "guildlink.labels" (dict "root" . "component" "valkey") | nindent 4 }}
spec:
  selector:
    {{- include "guildlink.selectorLabels" (dict "root" . "component" "valkey") | nindent 4 }}
  ports:
    - port: 6379
      targetPort: valkey
