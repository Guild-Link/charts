apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cf-router
  labels:
    app.kubernetes.io/name: cf-router
    app.kubernetes.io/part-of: guildlink
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: cf-router
  replicas: {{ index .Values.replicas "cf-router" }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cf-router
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cf-router
        app.kubernetes.io/part-of: guildlink
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsGroup: 65532
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cf-router
          image: {{ index .Values.images "cf-router" }}
          env:
            - name: FORWARDS
              value: "0.0.0.0:25565=mc.hypixel.net:25565"
          ports:
            - name: minecraft
              containerPort: 25565
          resources:
            {{- toYaml (index .Values.resources "cf-router") | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        labels:
          app.kubernetes.io/name: cf-router
          app.kubernetes.io/part-of: guildlink
          app.kubernetes.io/instance: {{ .Release.Name }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cf-router
  labels:
    app.kubernetes.io/name: cf-router
    app.kubernetes.io/part-of: guildlink
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: cf-router
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ index .Values.ports "cf-router" }}
      targetPort: minecraft
