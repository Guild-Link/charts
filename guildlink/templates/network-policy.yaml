apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-clients-egress
  labels:
    app.kubernetes.io/name: guildlink
    app.kubernetes.io/part-of: guildlink
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: guildlink
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - bot
          - worker
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "guildlink.selectorLabels" (dict "root" . "component" "valkey") | nindent 14 }}
      ports:
        - port: valkey
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-valkey-ingress
  labels:
    {{- include "guildlink.labels" (dict "root" . "component" "valkey") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "guildlink.selectorLabels" (dict "root" . "component" "valkey") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: guildlink
              app.kubernetes.io/instance: {{ .Release.Name }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - bot
                  - worker
      ports:
        - port: valkey
          protocol: TCP
