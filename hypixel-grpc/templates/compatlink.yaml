apiVersion: apps/v1
kind: Deployment
metadata:
  name: compatlink
  labels:
    app.kubernetes.io/name: compatlink
    app.kubernetes.io/part-of: hypixel-grpc
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas.compatlink }}
  selector:
    matchLabels:
      app.kubernetes.io/name: compatlink
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compatlink
        app.kubernetes.io/part-of: hypixel-grpc
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: compatlink
          image: {{ .Values.images.compatlink }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            {{- toYaml .Values.resources.compatlink | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: compatlink
  labels:
    app.kubernetes.io/name: compatlink
    app.kubernetes.io/part-of: hypixel-grpc
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: hypixel-grpc
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.ports.compatlink }}
      targetPort: http
