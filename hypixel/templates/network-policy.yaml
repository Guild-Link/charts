apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api-egress
  labels:
    {{- include "hypixel.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hypixel.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "hypixel.selectorLabels" (dict "root" . "component" "valkey") | nindent 14 }}
      ports:
        - port: valkey
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- include "hypixel.selectorLabels" (dict "root" . "component" "compat-api") | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-internal-ingress
  labels:
    app.kubernetes.io/name: hypixel
    app.kubernetes.io/part-of: guildlink
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hypixel
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - valkey
          - compat-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "hypixel.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
      ports:
        - port: valkey
          protocol: TCP
        - port: http
          protocol: TCP
